<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Two stacked study cards in the Starfield accent (starlight blue), with
       the back card carrying a hint of the Nebula gradient; transparent
       background so it reads cleanly on both light and dark tab bars. -->
  <defs>
    <linearGradient id="nebula" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef852e"/>
      <stop offset="55%" stop-color="#c841a5"/>
      <stop offset="100%" stop-color="#3093ec"/>
    </linearGradient>
  </defs>
  <rect x="13" y="11" width="30" height="42" rx="7" fill="url(#nebula)" opacity="0.55" transform="rotate(-8 28 32)"/>
  <rect x="21" y="12" width="30" height="42" rx="7" fill="#3093ec" transform="rotate(5 36 33)"/>
  <text x="36" y="41" text-anchor="middle" font-family="'Space Grotesk', 'Segoe UI', -apple-system, sans-serif" font-size="24" font-weight="700" fill="#e1e5eb" transform="rotate(5 36 33)">S</text>
</svg>
